<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG icons, so the home-screen tile needs a PNG. Square
         corners on purpose: iOS applies its own rounded mask. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Otabek Mamadaliev — Junior Software Engineer based in Poland. Five deployed products across React, TypeScript, APIs, payments, AI, testing, and Cloudflare."
    />
    <!-- The bare domain is canonical; www 308-redirects to it. -->
    <link rel="canonical" href="https://otabekmamadaliev.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Otabek Mamadaliev" />
    <meta name="theme-color" content="#101619" />

    <!-- Open Graph: gives the link a preview card on LinkedIn, WhatsApp, Upwork, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Otabek Mamadaliev" />
    <meta property="og:url" content="https://otabekmamadaliev.com/" />
    <meta property="og:title" content="Otabek Mamadaliev — Junior Software Engineer" />
    <meta
      property="og:description"
      content="Final-year Software Engineering student with five deployed products across frontend, APIs, data, payments, AI, testing, and deployment."
    />
    <meta property="og:image" content="https://otabekmamadaliev.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Otabek Mamadaliev, Junior Software Engineer — five deployed products."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Otabek Mamadaliev — Junior Software Engineer" />
    <meta
      name="twitter:description"
      content="Final-year Software Engineering student with five deployed products."
    />
    <meta name="twitter:image" content="https://otabekmamadaliev.com/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Martian+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Otabek Mamadaliev — Junior Software Engineer</title>

    <!-- Structured data: tells Google this site is a person, and links the
         profiles together so a search for the name resolves to one identity. -->

      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Otabek Mamadaliev",
        "jobTitle": "Junior Software Engineer",
        "url": "https://otabekmamadaliev.com/",
        "image": "https://otabekmamadaliev.com/og.png",
        "email": "mailto:contact@otabekmamadaliev.com",
        "sameAs": [
          "https://github.com/otabekmamadaliev",
          "https://www.linkedin.com/in/otabekmamadaliev/"
        ],
        "knowsAbout": [
          "Software engineering",
          "React",
          "TypeScript",
          "Django",
          "PostgreSQL",
          "Automated testing",
          "JavaScript",
          "API integration",
          "Responsive design"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

</html>
